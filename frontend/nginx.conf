# Define one HTTP virtual server for nginx.
server {
# Listen for incoming HTTP requests on port 80.
    listen 80;
# Match this server for any hostname, since a Docker network routes it by container.
    server_name _;

# Serve static frontend files from this directory.
    root /usr/share/nginx/html;
# Use index.html as the default document.
    index index.html;

    # Proxy API calls to the backend container
# Match browser requests whose paths begin with /api/.
    location /api/ {
# Forward matching requests to the backend service on port 5001.
        proxy_pass http://backend:5001;
# Use HTTP/1.1 for the proxy connection.
        proxy_http_version 1.1;
# Forward the original request Host header.
        proxy_set_header Host $host;
# Forward the original client IP address.
        proxy_set_header X-Real-IP $remote_addr;
# Append the client IP to the forwarded-address header chain.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React Router fallback
# Match all remaining paths for the frontend single-page application.
    location / {
# Return a real file or directory when present; otherwise serve index.html.
        try_files $uri $uri/ /index.html;
    }
}
